<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting | BirdFanciers</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.birdfanciers.com/" />
  <script>
    const target = '/';
    const q = window.location.search || '';
    const h = window.location.hash || '';
    window.location.replace(target + q + h);
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">BirdFanciers home</a>…</p>
</body>
</html>
